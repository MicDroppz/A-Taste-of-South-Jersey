content:
  - name: menu
    label: Menu & Pricing
    type: file
    path: content/menu/menu.json
    format: json
    fields:
      - name: categories
        label: Menu Categories (Title | Description)
        type: list
        fields:
          - { name: title, label: Category Name, type: string }
          - { name: subtitle, label: Subtitle, type: string }
          - { name: icon, label: Emoji Icon, type: string }
          - { name: badge_color, label: Badge Color, type: string }
