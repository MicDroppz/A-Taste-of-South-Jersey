content:
  - name: menu
    label: Menu & Pricing
    type: file
    path: content/menu/menu.json
    format: json
    fields:
      - name: categories
        label: Menu Categories
        type: object
        list: true
        fields:
          - name: id
            label: Category ID
            type: string
          - name: title
            label: Category Name
            type: string
          - name: subtitle
            label: Subtitle
            type: text
          - name: icon
            label: Emoji Icon
            type: string
          - name: badge_color
            label: Badge Color
            type: string
          - name: items
            label: Menu Items
            type: object
            list: true
            fields:
              - name: name
                label: Item Name
                type: string
              - name: price
                label: Price
                type: number
              - name: badge
                label: Badge
                type: string
              - name: description
                label: Description
                type: text
              - name: image
                label: Image URL
                type: string

      - name: modifiers
        label: Extras & Modifiers
        type: object
        list: true
        fields:
          - name: id
            label: ID
            type: string
          - name: label
            label: Modifier Name
            type: string
          - name: price
            label: Price
            type: number

  - name: site_settings
    label: Site Settings & Truck Radar
    type: file
    path: content/settings.json
    format: json
    fields:
      - name: announcement_bar
        label: Top Announcement Banner Text
        type: string

      - name: primary_address
        label: Current Truck Address & Location Info
        type: string

      - name: status_override
        label: Live Operational Status Override
        type: select
        options:
          - name: Auto (Schedule Based)
            value: AUTO
          - name: Force Open (🟢 OPEN NOW)
            value: MANUAL_OPEN
          - name: Force Closed (🔴 CLOSED NOW)
            value: MANUAL_CLOSED

      - name: weekly_schedule
        label: Flexible Weekly Schedule Cards
        type: object
        list: true
        fields:
          - name: days
            label: Days (e.g. TUES - THURS)
            type: string
          - name: location
            label: Location (e.g. 1398 E Vine St)
            type: string
          - name: hours
            label: Operating Hours (e.g. 11 AM - 8 PM)
            type: string
          - name: card_color
            label: Color Theme
            type: select
            options:
              - name: Yellow
                value: yellow
              - name: Teal
                value: teal
              - name: Pink
                value: pink
              - name: Purple
                value: purple

  - name: drop_settings
    label: Delivery Drop & Catering Settings
    type: file
    path: content/drop-settings.json
    format: json
    fields:
      - name: drop_min_amount
        label: Sunday Delivery Drop Minimum Order Amount ($)
        type: number

      - name: drop_capacity_text
        label: Slot Capacity Warning Text
        type: string

      - name: catering_deposit_pct
        label: Catering Deposit Percentage (%)
        type: number
