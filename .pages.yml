# Pages CMS configuration. Lives in the repo root.
media:
  input: images
  output: /images
  rename: safe        # uploads get web-safe names (no spaces/odd characters)

content:
  - name: menu
    label: Menu & Pricing
    type: file
    path: content/menu/menu.json
    format: json
    fields:
      - name: categories
        label: Menu Categories
        type: object
        list: true
        fields:
          - name: id
            label: Category ID (keep 'sides' unchanged - it controls the quick-add button)
            type: string
          - name: title
            label: Category Name
            type: string
          - name: subtitle
            label: Subtitle
            type: text
          - name: icon
            label: Emoji Icon
            type: string
          - name: badge_color
            label: Badge Color
            type: select
            options:
              values:
                - name: bg-brandPurple
                  label: Purple
                - name: bg-brandOrange
                  label: Orange
                - name: bg-brandGreen
                  label: Green
                - name: bg-brandPink
                  label: Pink
                - name: bg-brandTeal
                  label: Teal
                - name: bg-brandRed
                  label: Red
          - name: items
            label: Menu Items
            type: object
            list: true
            fields:
              - name: name
                label: Item Name
                type: string
              - name: price
                label: Price
                type: number
              - name: badge
                label: Badge
                type: string
              - name: description
                label: Description
                type: text
              - name: sold_out
                label: Sold out today? (turns the Add button grey)
                type: boolean
              - name: image
                label: Photo
                type: image

      - name: modifiers
        label: Extras & Modifiers
        type: object
        list: true
        fields:
          - name: id
            label: ID (letters and dashes only)
            type: string
          - name: label
            label: Modifier Name
            type: string
          - name: price
            label: Price
            type: number

  - name: site_settings
    label: Site Settings, Hours & Location
    type: file
    path: content/settings.json
    format: json
    fields:
      - name: announcement_bar
        label: Top Announcement Banner Text
        type: string

      - name: web3forms_access_key
        label: Web3Forms Access Key (from web3forms.com - makes the catering, delivery and pickup forms email you)
        type: string

      - name: logo
        label: Logo
        type: image

      - name: primary_address
        label: Default Truck Address (shown when no truck stop is scheduled)
        type: string

      - name: status_override
        label: Truck / Pickup Status Override (does not change delivery - use the Delivery drop status setting for that)
        type: select
        options:
          values:
            - name: AUTO
              label: Auto (follows the weekly schedule below)
            - name: MANUAL_OPEN
              label: Force Open (pickup shows open all day, ignores hours)
            - name: MANUAL_CLOSED
              label: Force Closed (pickup shows closed all day, ignores hours - set back to Auto when done)

      - name: vip_signup_enabled
        label: Show the "Fryer Alert" VIP signup section on the website
        type: boolean

      - name: social
        label: Social Media Links (turn ON only the ones you want to show on the website)
        type: object
        fields:
          - name: instagram
            label: Instagram
            type: object
            fields:
              - name: show
                label: Show on website?
                type: boolean
              - name: url
                label: Link (full address starting with https://)
                type: string
          - name: facebook
            label: Facebook
            type: object
            fields:
              - name: show
                label: Show on website?
                type: boolean
              - name: url
                label: Link (full address starting with https://)
                type: string
          - name: tiktok
            label: TikTok
            type: object
            fields:
              - name: show
                label: Show on website?
                type: boolean
              - name: url
                label: Link (full address starting with https://)
                type: string
          - name: youtube
            label: YouTube
            type: object
            fields:
              - name: show
                label: Show on website?
                type: boolean
              - name: url
                label: Link (full address starting with https://)
                type: string
          - name: x
            label: X (Twitter)
            type: object
            fields:
              - name: show
                label: Show on website?
                type: boolean
              - name: url
                label: Link (full address starting with https://)
                type: string

      - name: allergen_note_show
        label: Show the allergen note under the menu?
        type: boolean

      - name: allergen_note
        label: Allergen note text (e.g. Contains dairy, wheat and eggs. Fried in shared oil.)
        type: text

      - name: weekly_schedule
        label: Weekly Schedule Cards
        type: object
        list: true
        fields:
          - name: off
            label: Turn this card OFF (keeps it saved, but hides it and treats it as closed)
            type: boolean
          - name: days
            label: Card Title (e.g. TUES - THURS)
            type: string
          - name: kind
            label: Type
            type: select
            options:
              values:
                - name: truck
                  label: Truck stop (customers pick up at the truck)
                - name: delivery
                  label: Delivery only (no truck pickup)
                - name: both
                  label: Both (truck stop + delivery)
          - name: open_days
            label: Open Days
            type: select
            options:
              multiple: true
              values:
                - name: Sun
                  label: Sunday
                - name: Mon
                  label: Monday
                - name: Tue
                  label: Tuesday
                - name: Wed
                  label: Wednesday
                - name: Thu
                  label: Thursday
                - name: Fri
                  label: Friday
                - name: Sat
                  label: Saturday
          - name: opens
            label: Opens
            type: select
            options:
              values:
                - name: "05:00"
                  label: "5:00 AM"
                - name: "06:00"
                  label: "6:00 AM"
                - name: "07:00"
                  label: "7:00 AM"
                - name: "08:00"
                  label: "8:00 AM"
                - name: "09:00"
                  label: "9:00 AM"
                - name: "10:00"
                  label: "10:00 AM"
                - name: "11:00"
                  label: "11:00 AM"
                - name: "12:00"
                  label: "12:00 PM (noon)"
                - name: "13:00"
                  label: "1:00 PM"
                - name: "14:00"
                  label: "2:00 PM"
                - name: "15:00"
                  label: "3:00 PM"
                - name: "16:00"
                  label: "4:00 PM"
                - name: "17:00"
                  label: "5:00 PM"
                - name: "18:00"
                  label: "6:00 PM"
                - name: "19:00"
                  label: "7:00 PM"
                - name: "20:00"
                  label: "8:00 PM"
                - name: "21:00"
                  label: "9:00 PM"
                - name: "22:00"
                  label: "10:00 PM"
                - name: "23:00"
                  label: "11:00 PM"
                - name: "24:00"
                  label: "12:00 AM (midnight)"
          - name: closes
            label: Closes
            type: select
            options:
              values:
                - name: "05:00"
                  label: "5:00 AM"
                - name: "06:00"
                  label: "6:00 AM"
                - name: "07:00"
                  label: "7:00 AM"
                - name: "08:00"
                  label: "8:00 AM"
                - name: "09:00"
                  label: "9:00 AM"
                - name: "10:00"
                  label: "10:00 AM"
                - name: "11:00"
                  label: "11:00 AM"
                - name: "12:00"
                  label: "12:00 PM (noon)"
                - name: "13:00"
                  label: "1:00 PM"
                - name: "14:00"
                  label: "2:00 PM"
                - name: "15:00"
                  label: "3:00 PM"
                - name: "16:00"
                  label: "4:00 PM"
                - name: "17:00"
                  label: "5:00 PM"
                - name: "18:00"
                  label: "6:00 PM"
                - name: "19:00"
                  label: "7:00 PM"
                - name: "20:00"
                  label: "8:00 PM"
                - name: "21:00"
                  label: "9:00 PM"
                - name: "22:00"
                  label: "10:00 PM"
                - name: "23:00"
                  label: "11:00 PM"
                - name: "24:00"
                  label: "12:00 AM (midnight)"
          - name: location
            label: Location (shown on the site as the truck address for this stop, e.g. 1398 E Vine St, Kissimmee, FL)
            type: string
          - name: card_color
            label: Color Theme
            type: select
            options:
              values:
                - name: yellow
                  label: Yellow
                - name: teal
                  label: Teal
                - name: pink
                  label: Pink
                - name: purple
                  label: Purple

  - name: drop_settings
    label: Delivery Drop & Catering Settings
    type: file
    path: content/drop-settings.json
    format: json
    fields:
      - name: drop_status
        label: Delivery drop status
        type: select
        options:
          values:
            - name: AUTO
              label: Automatic (follows the weekly schedule)
            - name: SOLD_OUT
              label: Sold out - no delivery right now
            - name: FORCE_OPEN
              label: Force open (for an unscheduled drop)

      - name: delivery_mode
        label: How do customers order delivery?
        type: select
        options:
          values:
            - name: REQUEST
              label: Request a quote (customer sends order + address, I reply with the fee and a payment link)
            - name: RESERVE
              label: Reserve with deposit (fee shows by ZIP code at checkout)

      - name: drop_min_amount
        label: Delivery Minimum Order Amount ($)
        type: number

      - name: drop_deposit_pct
        label: Delivery Deposit Percentage (%)
        type: number

      - name: catering_deposit_pct
        label: Catering Deposit Percentage (%)
        type: number

      - name: catering_policy_text
        label: Catering Policy Text (type {deposit} to insert the catering percentage)
        type: text

  - name: delivery_pricing
    label: Delivery Fees (by ZIP code)
    type: file
    path: content/delivery-pricing.json
    format: json
    fields:
      - name: zones
        label: Delivery Zones (customers must enter a ZIP code listed here)
        type: object
        list: true
        fields:
          - name: name
            label: Zone Name (e.g. Close - Kissimmee)
            type: string
          - name: fee
            label: Delivery Fee ($)
            type: number
          - name: zips
            label: ZIP Codes in this zone (separate with commas)
            type: text
